services:
  - type: web
    name: qarzdaftar-backend
    runtime: node
    plan: free
    rootDir: backend
    # NODE_ENV=production is set below (needed by the running app), but npm
    # honors that same variable during install by skipping devDependencies —
    # which is exactly where @nestjs/cli (the `nest build` command) lives.
    # --include=dev forces it to install anyway, regardless of NODE_ENV.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: AI_API_KEY
        sync: false
